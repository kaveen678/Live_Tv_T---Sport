<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Quality Live TV</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-level-selector-plugin@latest/dist/level-selector.min.js"></script>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
        }
        #player { 
            width: 100%; 
            max-width: 100%; 
            height: auto; 
            aspect-ratio: 16 / 9; 
            background: #000; 
        }
    </style>
</head>
<body>

<div id="player"></div>

<script>
    // නව ලින්ක් එක මෙහි ඇතුළත් කර ඇත
    const channelUrl = "https://tvsen1.aynaott.com/YNMn5kZz8aLm/index.m3u8";

    var player = new Clappr.Player({
        parentId: "#player",
        source: channelUrl, 
        width: '100%',
        height: '100%',
        autoPlay: true,
        mimeType: "application/x-mpegURL",
        plugins: [LevelSelector], // කොලිටිය තේරීමට හැකි ප්ලගිනය
        levelSelectorConfig: {
            title: 'Quality',
            labels: {
                2: 'High (720p/1080p)', 
                1: 'Medium',
                0: 'Low',
            },
            labelCallback: function(playbackLevel, customLabel) {
                return customLabel; 
            }
        },
        hlsjsConfig: {
            enableWorker: true,
            startLevel: -1, // උපරිම කොලිටියෙන් ආරම්භ කිරීමට උත්සාහ කරයි
            capLevelToPlayerSize: false,
            autoStartLoad: true
        }
    });

    player.on(Clappr.Events.PLAYER_ERROR, function() {
        setTimeout(function() {
            player.load(channelUrl);
            player.play();
        }, 2000);
    });
</script>
</body>
</html>
